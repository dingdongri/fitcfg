[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcfg"
version = "0.6.0"
description = "소규모 GPU 파인튜닝 설정 추천기: 학습 전에 메모리·속도를 예측하고 OOM 없는 가장 빠른 설정과 실행 스크립트를 만든다"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hwang Chan Dong"}]
dependencies = []            # 코어(예측·추천·CLI)는 표준 라이브러리만

[project.urls]
Homepage = "https://github.com/dingdongri/fitcfg"

[project.optional-dependencies]
hf = ["transformers>=4.46", "peft>=0.12", "torch>=2.1"]          # HF Trainer 플러그인 · measure-cpu
ui = ["streamlit>=1.50", "altair>=5", "pandas>=2"]                # 웹 UI
dev = ["pytest>=8"]

[project.scripts]
fitcfg = "fitcfg.cli:main"

[tool.setuptools]
packages = ["fitcfg", "fitcfg.integrations"]

[tool.setuptools.package-data]
fitcfg = ["priors.json", "calibrated.json", "templates/*.tmpl"]
